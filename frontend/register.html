<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign Up · Student Productivity Dashboard</title>
<link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
  <div class="auth-shell">
    <div class="auth-card">
      <div class="brand"><span class="logo-dot"></span> Productivity Hub</div>
      <h2>Create your account to get started.</h2>

      <form id="register-form">
        <div class="form-group">
          <label for="register-name">Full name</label>
          <input class="form-control" type="text" id="register-name" required placeholder="Jane Doe">
        </div>
        <div class="form-group">
          <label for="register-email">Email address</label>
          <input class="form-control" type="email" id="register-email" required placeholder="you@example.com">
        </div>
        <div class="form-group">
          <label for="register-password">Password</label>
          <div style="display:flex; gap:8px;">
            <input class="form-control" type="password" id="register-password" required minlength="6" placeholder="At least 6 characters">
            <button type="button" id="register-toggle-pw" class="btn btn-secondary btn-sm">Show</button>
          </div>
        </div>
        <div class="form-error" id="register-error"></div>
        <button type="submit" class="btn btn-primary" id="register-submit" style="width:100%; margin-top:6px;">Create Account</button>
      </form>
      <div class="auth-footer">Already have an account? <a href="login.html">Log in</a></div>
    </div>
  </div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/auth.js"></script>
  <script>initRegisterPage();</script>
</body>
</html>
