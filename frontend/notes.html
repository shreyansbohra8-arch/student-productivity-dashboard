<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Notes · Student Productivity Dashboard</title>
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-root"></div>
    <main class="main-content">
      <div id="mobile-topbar-root"></div>

      <div class="page-header">
        <div><h1>Notes</h1><p>Search uses MongoDB's full-text $text index.</p></div>
        <button class="btn btn-primary" id="add-note-btn">+ New Note</button>
      </div>

      <div class="filter-bar">
        <input type="text" id="note-search" placeholder="Search notes (e.g. aggregation)" style="flex:1; min-width:220px;">
        <select id="filter-note-subject"><option value="">All subjects</option></select>
      </div>

      <div id="notes-grid"></div>
      <div class="pagination" id="notes-pagination"></div>
    </main>
  </div>

  <div class="modal-backdrop" id="note-modal">
    <div class="modal">
      <div class="modal-header"><h3>New Note</h3><button class="modal-close" id="note-modal-close">&times;</button></div>
      <form id="note-form">
        <div class="modal-body">
          <div class="form-group"><label>Title</label><input class="form-control" id="note-title" required></div>
          <div class="form-group"><label>Content</label><textarea class="form-control" id="note-content" required style="min-height:120px;"></textarea></div>
          <div class="form-group"><label>Subject</label><select class="form-control" id="note-subject"></select></div>
          <div class="form-group"><label>Tags (comma separated)</label><input class="form-control" id="note-tags" placeholder="e.g. mongodb, revision"></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="note-cancel-btn">Cancel</button>
          <button type="submit" class="btn btn-primary">Save Note</button>
        </div>
      </form>
    </div>
  </div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/subjects.js"></script>
  <script src="assets/js/notes.js"></script>
  <script>initNotesPage();</script>
</body>
</html>
