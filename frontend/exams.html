<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Exams · Student Productivity Dashboard</title>
<link rel="stylesheet" href="assets/css/style.css">
<link rel="stylesheet" href="assets/css/responsive.css">
</head>
<body>
  <div class="app-shell">
    <div id="sidebar-root"></div>
    <main class="main-content">
      <div id="mobile-topbar-root"></div>

      <div class="page-header">
        <div><h1>Exams</h1><p>Keep track of upcoming exams with live countdowns.</p></div>
        <button class="btn btn-primary" id="add-exam-btn">+ New Exam</button>
      </div>

      <div id="exams-grid"></div>
    </main>
  </div>

  <div class="modal-backdrop" id="exam-modal">
    <div class="modal">
      <div class="modal-header"><h3>New Exam</h3><button class="modal-close" id="exam-modal-close">&times;</button></div>
      <form id="exam-form">
        <div class="modal-body">
          <div class="form-group"><label>Exam name</label><input class="form-control" id="exam-name" required placeholder="e.g. DBMS Mid-Semester Exam"></div>
          <div class="form-group"><label>Exam date</label><input class="form-control" type="date" id="exam-date" required></div>
          <div class="form-group"><label>Subject</label><select class="form-control" id="exam-subject"></select></div>
          <div class="form-group"><label>Description (optional)</label><textarea class="form-control" id="exam-description"></textarea></div>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" id="exam-cancel-btn">Cancel</button>
          <button type="submit" class="btn btn-primary">Add Exam</button>
        </div>
      </form>
    </div>
  </div>

  <script src="assets/js/api.js"></script>
  <script src="assets/js/common.js"></script>
  <script src="assets/js/subjects.js"></script>
  <script src="assets/js/exams.js"></script>
  <script>initExamsPage();</script>
</body>
</html>
